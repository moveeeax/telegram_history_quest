services:
  history-quest-bot:
    build: .
    container_name: history_quest_bot
    restart: unless-stopped
    # Токен берётся только из .env и не дублируется в environment,
    # чтобы не попасть в вывод `docker compose config`.
    env_file:
      - .env
    environment:
      - TASKS_DIR=tasks
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.getenv('TELEGRAM_BOT_TOKEN') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
